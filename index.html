<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mi Asistente IA</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: #ffffff;
      color: #1f1f1f;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    /* Barra superior minimalista */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background-color: #ffffff;
      z-index: 10;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid #e5e5e5;
      background-color: #f8f9fa;
      color: #1f1f1f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
    }

    .header-pill {
      background-color: #eef4ff;
      color: #1a73e8;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Panel oculto de Clave API */
    #api-modal {
      display: none;
      position: fixed;
      top: 64px;
      left: 16px;
      right: 16px;
      background: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      z-index: 100;
    }

    #api-modal h3 {
      font-size: 15px;
      margin-bottom: 10px;
      color: #333;
    }

    .api-row {
      display: flex;
      gap: 8px;
    }

    .api-row input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
    }

    .api-row button {
      background-color: #1f1f1f;
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Área de chat con scroll fluido */
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    #welcome-screen {
      margin-top: auto;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .suggestion-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      color: #444;
      font-size: 15px;
      cursor: pointer;
    }

    .suggestion-item:active {
      background-color: #f2f2f2;
    }

    /* Burbujas de mensajes */
    .message {
      max-width: 88%;
      line-height: 1.5;
      font-size: 15px;
      word-wrap: break-word;
    }

    .user-message {
      align-self: flex-end;
      background-color: #f4f4f4;
      color: #1f1f1f;
      padding: 12px 16px;
      border-radius: 20px;
      border-bottom-right-radius: 6px;
    }

    .bot-message {
      align-self: flex-start;
      color: #1f1f1f;
      width: 100%;
      max-width: 100%;
      padding: 4px 2px;
    }

    .bot-message p { margin-bottom: 10px; }
    .bot-message ul, .bot-message ol { margin-left: 20px; margin-bottom: 10px; }
    .bot-message li { margin-bottom: 4px; }
    .bot-message pre {
      background: #1e1e1e;
      color: #f8f8f2;
      padding: 12px;
      border-radius: 10px;
      overflow-x: auto;
      margin: 10px 0;
      font-size: 13px;
    }

    .speak-btn {
      margin-top: 6px;
      background: #f4f4f4;
      border: none;
      border-radius: 14px;
      padding: 5px 12px;
      font-size: 12px;
      color: #444;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* Menú flotante estilo ChatGPT al tocar + */
    #plus-menu {
      display: none;
      position: fixed;
      bottom: 76px;
      left: 16px;
      width: 240px;
      background: #ffffff;
      border-radius: 20px;
      padding: 10px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.16);
      border: 1px solid #f0f0f0;
      z-index: 90;
      flex-direction: column;
      gap: 4px;
    }

    .menu-option {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 12px;
      border-radius: 14px;
      border: none;
      background: transparent;
      font-size: 15px;
      color: #1f1f1f;
      cursor: pointer;
      text-align: left;
      width: 100%;
    }

    .menu-option:active {
      background-color: #f4f4f4;
    }

    .menu-icon-circle {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background-color: #f2f3f5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    /* Etiqueta de modo activo o archivo adjunto */
    #status-chips {
      display: flex;
      gap: 8px;
      padding: 0 16px 6px 16px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .chip {
      display: none;
      align-items: center;
      gap: 6px;
      background: #eef4ff;
      color: #1a73e8;
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
    }

    .chip button {
      border: none;
      background: none;
      color: #1a73e8;
      font-weight: bold;
      cursor: pointer;
    }

    /* Barra inferior fija y siempre visible */
    footer {
      padding: 6px 14px 16px 14px;
      background-color: #ffffff;
      flex-shrink: 0;
    }

    .input-pill {
      display: flex;
      align-items: center;
      background-color: #f4f4f4;
      border-radius: 28px;
      padding: 6px 8px 6px 12px;
      gap: 6px;
    }

    .plus-btn {
      background: none;
      border: none;
      font-size: 24px;
      color: #444;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      transition: transform 0.2s;
    }

    .plus-btn.abierto {
      transform: rotate(45deg);
    }

    #user-input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 16px;
      color: #1f1f1f;
      outline: none;
      resize: none;
      max-height: 100px;
      padding: 6px 0;
    }

    #mic-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background-color: transparent;
      color: #444;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    #mic-btn.grabando {
      background-color: #ea4335;
      color: #ffffff;
    }

    #voice-mode-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background-color: #1a73e8;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    #send-btn {
      display: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background-color: #1f1f1f;
      color: #ffffff;
      font-size: 16px;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Pantalla completa de Conversación por Voz */
    #voice-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(180deg, #f8fbff 0%, #ffffff 100%);
      z-index: 200;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 40px 24px;
    }

    .voice-header {
      font-size: 16px;
      font-weight: 600;
      color: #1a73e8;
    }

    .voice-orb-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .voice-orb {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #60a5fa, #1a73e8);
      box-shadow: 0 12px 35px rgba(26, 115, 232, 0.35);
      transition: transform 0.3s ease;
    }

    .voice-orb.escuchando {
      animation: respirar 1.5s infinite ease-in-out;
      background: radial-gradient(circle at 30% 30%, #34d399, #059669);
      box-shadow: 0 12px 35px rgba(5, 150, 105, 0.35);
    }

    .voice-orb.hablando {
      animation: hablarAnim 0.6s infinite alternate ease-in-out;
      background: radial-gradient(circle at 30% 30%, #60a5fa, #2563eb);
    }

    @keyframes respirar {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    @keyframes hablarAnim {
      0% { transform: scale(0.95); }
      100% { transform: scale(1.15); }
    }

    #voice-status {
      font-size: 18px;
      font-weight: 500;
      color: #333;
      text-align: center;
    }

    #voice-subtitle {
      font-size: 14px;
      color: #666;
      text-align: center;
      max-width: 300px;
      min-height: 40px;
    }

    .close-voice-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      background-color: #ea4335;
      color: #ffffff;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(234, 67, 53, 0.3);
    }
  </style>
</head>
<body onclick="cerrarMenuSiFuera(event)">

  <header>
    <button class="icon-btn" onclick="toggleApiModal()" title="Configurar Clave API">☰</button>
    <div class="header-pill">✦ Mi Asistente IA</div>
