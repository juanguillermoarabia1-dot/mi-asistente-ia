<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Asistente IA Personal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #131314; color: #e3e3e3; display: flex; flex-direction: column; height: 100vh; }
        
        header { background-color: #1e1f20; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333537; flex-wrap: wrap; gap: 10px; }
        header h1 { font-size: 1.1rem; color: #a8c7fa; }
        
        .api-box { display: flex; gap: 8px; align-items: center; }
        .api-box input { background: #131314; border: 1px solid #444746; color: #fff; padding: 6px 10px; border-radius: 6px; width: 230px; font-size: 0.85rem; }
        .api-box button { background: #a8c7fa; color: #062e6f; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; max-width: 900px; width: 100%; margin: 0 auto; }
        
        .mensaje { padding: 14px 18px; border-radius: 14px; max-width: 82%; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
        .usuario { background-color: #2b2c2f; align-self: flex-end; border-bottom-right-radius: 4px; }
        .ia { background-color: #1e1f20; border: 1px solid #333537; align-self: flex-start; border-bottom-left-radius: 4px; }
        .mensaje img { max-width: 260px; border-radius: 8px; display: block; margin-top: 8px; }
        
        #vista-previa { max-width: 900px; width: 100%; margin: 0 auto; padding: 0 20px 8px; display: none; align-items: center; gap: 10px; font-size: 0.85rem; color: #a8c7fa; }
        #vista-previa button { background: #ff5252; color: white; border: none; border-radius: 4px; padding: 2px 8px; cursor: pointer; }

        footer { background-color: #1e1f20; padding: 14px 20px; border-top: 1px solid #333537; }
        .input-area { max-width: 900px; margin: 0 auto; display: flex; gap: 10px; align-items: center; }
        
        .btn-adjuntar { background: #2b2c2f; color: #e3e3e3; border: 1px solid #444746; padding: 10px 14px; border-radius: 10px; cursor: pointer; font-size: 1.1rem; }
        .btn-adjuntar:hover { background: #37393b; }
        
        textarea { flex: 1; background: #131314; border: 1px solid #444746; color: #fff; padding: 12px; border-radius: 10px; resize: none; height: 48px; font-size: 0.95rem; outline: none; }
        textarea:focus { border-color: #a8c7fa; }
        
        .btn-enviar { background: #a8c7fa; color: #062e6f; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.95rem; }
        .btn-enviar:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

<header>
    <h1>⚡ Mi Asistente IA Personal</h1>
    <div class="api-box">
        <input type="password" id="api-key" placeholder="Pega tu API Key de Google AI Studio">
        <button onclick="guardarKey()">Guardar Clave</button>
    </div>
</header>

<div id="chat-container">
    <div class="mensaje ia">¡Hola! Ya estoy listo. Escríbeme lo que necesites o adjunta imágenes y archivos con el botón 📎.</div>
</div>

<div id="vista-previa">
    <span id="nombre-archivo"></span>
    <button onclick="quitarArchivo()">Quitar</button>
</div>

<footer>
    <div class="input-area">
        <input type="file" id="input-archivo" style="display: none;" accept="image/*,.pdf,.txt,.csv,.js,.html,.css,.json">
        <button class="btn-adjuntar" title="Subir imagen o archivo" onclick="document.getElementById('input-archivo').click()">📎</button>
        <textarea id="prompt" placeholder="Escribe tu mensaje aquí... (Enter para enviar)"></textarea>
        <button class="btn-enviar" id="btn-enviar" onclick="enviarMensaje()">Enviar</button>
    </div>
</footer>

<script>
    const chatContainer = document.getElementById('chat-container');
    const promptInput = document.getElementById('prompt');
    const apiKeyInput = document.getElementById('api-key');
    const inputArchivo = document.getElementById('input-archivo');
    const vistaPrevia = document.getElementById('vista-previa');
    const nombreArchivoSpan = document.getElementById('nombre-archivo');
    const btnEnviar = document.getElementById('btn-enviar');

    let archivoActual = null;
    let historial = [];

    window.onload = () => {
        const keyGuardada = localStorage.getItem('mi_gemini_api_key');
        if (keyGuardada) apiKeyInput.value = keyGuardada;
    };

    function guardarKey() {
        const key = apiKeyInput.value.trim();
        if (!key) return alert('Por favor pega una API Key válida.');
        localStorage.setItem('mi_gemini_api_key', key);
        alert('✅ Clave guardada en tu navegador.');
    }

    inputArchivo.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = () => {
            const base64Data = reader.result.split(',')[1];
            archivoActual = {
                name: file.name,
                mimeType: file.type || 'text/plain',
                data: base64Data,
                previewUrl: file.type.startsWith('image/') ? reader.result : null
            };
            nombreArchivoSpan.textContent = `📄 Adjunto: ${file.name}`;
            vistaPrevia.style.display = 'flex';
        };
        reader.readAsDataURL(file);
    });

    function quitarArchivo() {
        archivoActual = null;
        inputArchivo.value = '';
        vistaPrevia.style.display = 'none';
    }

    promptInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            enviarMensaje();
        }
    });

    function agregarBurbuja(texto, clase, imagenUrl = null) {
        const div = document.createElement('div');
        div.className = `mensaje ${clase}`;
        div.textContent = texto;
        if (imagenUrl) {
            const img = document.createElement('img');
            img.src = imagenUrl;
            div.appendChild(img);
        }
        chatContainer.appendChild(div);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return div;
    }

    async function enviarMensaje() {
        const apiKey = apiKeyInput.value.trim();
        const texto = promptInput.value.trim();

        if (!apiKey) return alert('⚠️ Primero pega tu API Key en la barra de arriba y dale a Guardar Clave.');
        if (!texto && !archivoActual) return;

        agregarBurbuja(texto || `[Archivo enviado: ${archivoActual.name}]`, 'usuario', archivoActual?.previewUrl);

        const partesUsuario = [];
        if (texto) partesUsuario.push({ text: texto });
        if (archivoActual) {
            partesUsuario.push({
                inlineData: {
                    mimeType: archivoActual.mimeType,
                    data: archivoActual.data
                }
            });
        }

        historial.push({ role: "user", parts: partesUsuario });

        promptInput.value = '';
        quitarArchivo();
        btnEnviar.disabled = true;

        const burbujaCargando = agregarBurbuja('Pensando...', 'ia');

        try {
             const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=" + apiKey;
            const respuesta = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: historial })
            });

            const datos = await respuesta.json();

            if (datos.error) {
                burbujaCargando.textContent = `❌ Error: ${datos.error.message}`;
                historial.pop();
            } else {
                const textoIA = datos.candidates[0].content.parts[0].text;
                burbujaCargando.textContent = textoIA;
                historial.push({ role: "model", parts: [{ text: textoIA }] });
            }
        } catch (err) {
            burbujaCargando.textContent = `❌ Error de conexión: ${err.message}`;
            historial.pop();
        } finally {
            btnEnviar.disabled = false;
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    }
</script>

</body>
</html>
